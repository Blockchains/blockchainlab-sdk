[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchainlab-sdk"
version = "1.1.0"
description = "Typed Python client for the Blockchain Lab Open Data API (chains, DeFi TVL, stablecoins, yields, bridges, DEX volumes, L2BEAT metrics, hacks, OFAC addresses, RPC health, EIPs). Built by Blockchain Lab — https://blockchainlab.com"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Blockchain Lab", email = "Blockchains@users.noreply.github.com" }]
keywords = ["blockchain", "ethereum", "defi", "stablecoins", "l2beat", "defillama", "sdk", "open-data"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed", "License :: OSI Approved :: MIT License"]
[project.urls]
Homepage = "https://github.com/Blockchains/blockchainlab-sdk"
API = "https://blockchains.github.io/blockchainlab-api/"
"Blockchain Lab" = "https://blockchainlab.com/?utm_source=pypi&utm_medium=package&utm_campaign=blockchainlab-sdk"
[tool.setuptools]
packages = ["blockchainlab_sdk"]
[tool.setuptools.package-data]
blockchainlab_sdk = ["py.typed"]
