name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "50 4 * * *" }]   # daily: catches API changes the SDK hasn't picked up
  workflow_dispatch:
permissions: { contents: read }
jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [18, 20, 22] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.9", "3.11", "3.13"] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install mypy==1.13.0 ./python
      - run: cd python && mypy blockchainlab_sdk --ignore-missing-imports
      - run: cd python && python -m unittest -v tests/test_live.py
  types-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate types from the live JSON Schemas; fail if they drifted
        run: python3 scripts/gen.py && git diff --stat --exit-code
  install-from-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: npm install github:Blockchains/blockchainlab-sdk in a clean project
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i --no-audit --no-fund "github:${{ github.repository }}#${{ github.sha }}"
          node --input-type=module -e "import {BlockchainLab} from 'blockchainlab-sdk'; const c=await new BlockchainLab().catalogue(); if(c.datasets.length<20) process.exit(1); console.log(c.datasets.length,'datasets')"
